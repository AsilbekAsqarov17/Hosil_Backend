        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          description: Paginated order list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSummaryPageEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /market/input-orders/{orderId}:
    get:
      summary: Get input order details
      operationId: getInputOrderDetail
      description: Returns complete order detail, snapshots, line items, and reservations for authorized buyer or seller.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderIdParam'
      responses:
        '200':
