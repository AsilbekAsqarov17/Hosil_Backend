          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /logistics/shipment-requests/{requestId}/status:
    patch:
      summary: Update shipment transit status
      operationId: updateShipmentStatus
      description: Forward sequential status progression (ACCEPTED -> PICKUP_ARRANGED -> PICKED_UP -> IN_TRANSIT -> DELIVERED).
      security:
        - BearerAuth: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateShipmentStatusRequest'
      responses:
        '200':
          description: Shipment status updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentRequestDetailDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /logistics/shipment-requests/{requestId}/cancel:
    post:
      summary: Cancel shipment request
      operationId: cancelShipmentRequest
      description: Stage-gated cancellation permitted prior to cargo pickup.
      security:
        - BearerAuth: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelShipmentRequest'
      responses:
        '200':
          description: Shipment request cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentRequestDetailDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /logistics/shipment-requests/{requestId}/history:
    get:
      summary: Get shipment status history
      operationId: getShipmentHistory
      description: Returns chronological audit status trail for shipment request.
      security:
        - BearerAuth: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Status history list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShipmentStatusHistoryDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /logistics/carrier-profile:
    get:
      summary: Get current user's carrier profile
      operationId: getMyCarrierProfile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Carrier profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarrierProfileDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    put:
      summary: Create or update current user's carrier profile
      operationId: upsertMyCarrierProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCarrierProfileRequest'
      responses:
        '200':
          description: Carrier profile updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarrierProfileDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /logistics/carrier-profile/{carrierUserId}/verification:
    patch:
      summary: Administrative carrier verification status update
      operationId: updateCarrierVerificationStatus
      security:
        - BearerAuth: []
      description: |
        Allows platform administrators to approve (VERIFIED), reject (REJECTED), or revert a carrier profile.
        Carriers cannot self-verify; self-service upsert resets status to PENDING. Only carriers in VERIFIED status may accept shipment requests.
      parameters:
        - name: carrierUserId
          in: path
          required: true
          description: UUID of the carrier user account
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCarrierVerificationRequest'
      responses:
        '200':
          description: Carrier verification status successfully updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarrierProfileDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

# =========================================================================
# REUSABLE COMPONENTS & SCHEMAS
# =========================================================================

components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter the Bearer access token issued by /auth/otp/verify or /auth/token/refresh.

  parameters:
    FarmIdParam:
      name: farmId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FieldIdParam:
      name: fieldId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CycleIdParam:
      name: cycleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BatchIdParam:
      name: batchId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MembershipIdParam:
      name: membershipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
    SizeParam:
      name: size
      in: query
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    SortParam:
      name: sort
      in: query
      required: false
      schema:
        type: string
        example: "createdAt,desc"
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Client-generated UUIDv4 preventing duplicate execution on network retry.
    ListingIdParam:
      name: listingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CropTypeQueryParam:
      name: cropType
      in: query
      required: false
      schema:
        type: string
        example: "Pomidor"
    RegionQueryParam:
      name: region
      in: query
      required: false
      schema:
        type: string
        example: "Toshkent viloyati"
    DistrictQueryParam:
      name: district
      in: query
      required: false
      schema:
        type: string
        example: "Yangiyoʻl tumani"
    QualityGradeQueryParam:
      name: qualityGrade
      in: query
      required: false
      schema:
        type: string
        enum: [PREMIUM, FIRST_CLASS, SECOND_CLASS, STANDARD, INDUSTRIAL]
        example: "FIRST_CLASS"
    MinPriceQueryParam:
      name: minPrice
      in: query
      required: false
      schema:
        type: number
        minimum: 0
        example: 5000.00
    MaxPriceQueryParam:
      name: maxPrice
      in: query
      required: false
      schema:
        type: number
        minimum: 0
        example: 8000.00
    IsRfqEnabledQueryParam:
      name: isRfqEnabled
      in: query
      required: false
      schema:
        type: boolean
        example: false
    InquiryIdParam:
      name: inquiryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InquiryRoleQueryParam:
      name: role
      in: query
      required: false
      schema:
        type: string
        enum: [BUYER, SELLER]
        example: "BUYER"
    InquiryStatusQueryParam:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [OPEN, AGREED, REJECTED, WITHDRAWN, EXPIRED]
        example: "OPEN"
    ListingIdQueryParam:
      name: listingId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    OrderIdParam:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderRoleQueryParam:
      name: role
      in: query
      required: false
      schema:
        type: string
        enum: [BUYER, SELLER]
        example: "BUYER"
    OrderStatusQueryParam:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [DRAFT, AWAITING_SELLER_CONFIRMATION, PENDING_PAYMENT, CONFIRMED, PROCESSING, READY_FOR_DISPATCH, IN_TRANSIT, COMPLETED, CANCELLED, DISPUTED]
        example: "AWAITING_SELLER_CONFIRMATION"
    ProductIdParam:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OfferIdParam:
      name: offerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CatalogCategoryIdQueryParam:
      name: categoryId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    CatalogSearchQueryParam:
      name: search
      in: query
      required: false
      schema:
        type: string
        example: "Karbamid"
    OfferStatusQueryParam:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [ACTIVE, INACTIVE, OUT_OF_STOCK]
        example: "ACTIVE"

  responses:
    BadRequestError:
      description: Malformed syntax or schema validation failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnauthorizedError:
      description: Authentication token missing, expired, or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ForbiddenError:
      description: Caller lacks required role or farm membership permissions.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFoundError:
      description: Resource not found or caller unauthorized to inspect existence.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ConflictError:
      description: Conflict with current state (e.g. concurrent modification, offer expired, turn violation).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimitError:
      description: Request threshold exceeded.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PreconditionRequiredError:
      description: Precondition required (e.g. Telegram account linking required before OTP dispatch).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    # -----------------------------------------------------------------------
    # Error Schemas
    # -----------------------------------------------------------------------
    ErrorEnvelope:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - correlationId
            - timestamp
          properties:
            code:
              type: string
              example: "VALIDATION_FAILED"
            message:
              type: string
              example: "The request payload failed structural validation."
            correlationId:
              type: string
              example: "req-8f4b-1234-9876"
            timestamp:
              type: string
              format: date-time
              example: "2026-10-14T09:30:00Z"
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'

    ErrorDetail:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          example: "allocatedQuantity"
        rejectedValue:
          type: string
          example: "5000.000"
        message:
          type: string
          example: "Allocated quantity cannot exceed unallocated batch quantity (3200.000 KG)."

    # -----------------------------------------------------------------------
    # Auth & Identity Schemas
    # -----------------------------------------------------------------------
    OtpRequest:
      type: object
      required:
        - phoneNumber
      properties:
        phoneNumber:
          type: string
          pattern: '^(\+998)[0-9]{9}$'
          example: "+998901234567"

    OtpChallengeResponse:
      type: object
      required:
        - challengeId
        - expiresInSeconds
        - resendAfterSeconds
      properties:
        challengeId:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        expiresInSeconds:
          type: integer
          example: 180
        resendAfterSeconds:
          type: integer
          example: 60

    TelegramLinkSessionRequest:
      type: object
      required:
        - phoneNumber
      properties:
        phoneNumber:
          type: string
          pattern: '^(\+998)[0-9]{9}$'
          example: "+998901234567"

    TelegramLinkSessionResponse:
      type: object
      required:
        - sessionId
        - phoneNumber
        - botUsername
        - deepLink
        - expiresInSeconds
      properties:
        sessionId:
          type: string
          format: uuid
          example: "b8a5fc94-71e8-4660-8451-d41a5f187a03"
        phoneNumber:
          type: string
          example: "+998901234567"
        botUsername:
          type: string
          example: "hosil_authentication_bot"
        deepLink:
          type: string
          example: "https://t.me/hosil_authentication_bot?start=E5Gf_v4hZ3k"
        expiresInSeconds:
          type: integer
          example: 600

    TelegramLinkStatusRequest:
      type: object
      required:
        - sessionToken
      properties:
        sessionToken:
          type: string
          description: Cryptographic opaque token issued by createTelegramLinkSession.
          example: "4s7D_f8a9_sample_session_token_32bytes"

    TelegramLinkStatusResponse:
      type: object
      required:
        - isLinked
      properties:
        isLinked:
          type: boolean
          example: true

    OtpVerifyRequest:
      type: object
      required:
        - challengeId
        - otpCode
      properties:
        challengeId:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        otpCode:
          type: string
          pattern: '^[0-9]{6}$'
          example: "849201"
        deviceFingerprint:
          type: string
          example: "samsung-sm-a125f-uuid9876"
        userAgent:
          type: string
          example: "HosilFarm/1.0.0 (Android 14; Build/UP1A)"

    AuthTokenResponse:
      type: object
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresInSeconds
      properties:
        accessToken:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refreshToken:
          type: string
          example: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
        tokenType:
          type: string
          example: "Bearer"
        expiresInSeconds:
          type: integer
          example: 900
        isNewUser:
          type: boolean
          example: false
        user:
          $ref: '#/components/schemas/UserSummaryDto'

    TokenRefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          example: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
        deviceFingerprint:
          type: string
          example: "samsung-sm-a125f-uuid9876"

    LogoutRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          example: "7c9e6679-7425-40de-944b-e07fc1f90ae7"

    UserSummaryDto:
      type: object
      required:
        - id
        - phoneNumber
        - status
        - roles
      properties:
        id:
          type: string
          format: uuid
          example: "e4b3c2a1-0000-4000-a000-000000000001"
        phoneNumber:
          type: string
          example: "+998901234567"
        status:
          type: string
          enum: [PENDING_VERIFICATION, ACTIVE, SUSPENDED, DEACTIVATED]
          example: "ACTIVE"
        roles:
          type: array
          items:
            type: string
          example: ["REGISTERED_USER", "FARMER"]

    UserProfileDto:
      type: object
      required:
        - fullName
        - preferredLanguage
        - region
        - district
      properties:
        fullName:
          type: string
          example: "Rustam Karimov"
        preferredLanguage:
          type: string
          enum: [uz-Latn, ru, uz-Cyrl]
          example: "uz-Latn"
        region:
          type: string
          example: "Toshkent viloyati"
        district:
          type: string
          example: "Yangiyoʻl tumani"
        avatarMediaId:
          type: string
          format: uuid
          nullable: true
          example: null

    SellerProfileDto:
      type: object
      required:
        - sellerType
        - verificationStatus
      properties:
        sellerType:
          type: string
          enum: [FARMER, COMMERCIAL_SUPPLIER, COOPERATIVE]
          example: "FARMER"
        legalBusinessName:
          type: string
          nullable: true
          example: null
        verificationStatus:
          type: string
          enum: [UNVERIFIED, PENDING_REVIEW, VERIFIED, REJECTED, SUSPENDED]
          example: "UNVERIFIED"
        verifiedAt:
          type: string
          format: date-time
          nullable: true
          example: null

    AccessibleFarmSummaryDto:
      type: object
      required:
        - farmId
        - farmName
        - membershipRole
        - permissionsMask
      properties:
        farmId:
          type: string
          format: uuid
          example: "f1a2b3c4-1111-4000-a000-000000000001"
        farmName:
          type: string
          example: "Karimov Bogʻdorchilik"
        membershipRole:
          type: string
          enum: [OWNER, MANAGER, AGRONOMIST, WORKER]
          example: "OWNER"
        permissionsMask:
          type: string
          example: "READ,WRITE_ACTIVITY,RECORD_HARVEST,PUBLISH_MARKET"

    UserDetailDto:
      type: object
      required:
        - id
        - phoneNumber
        - status
        - profile
        - roles
        - accessibleFarms
      properties:
        id:
          type: string
          format: uuid
          example: "e4b3c2a1-0000-4000-a000-000000000001"
        phoneNumber:
          type: string
          example: "+998901234567"
        status:
          type: string
          example: "ACTIVE"
        profile:
          $ref: '#/components/schemas/UserProfileDto'
        roles:
          type: array
          items:
            type: string
          example: ["REGISTERED_USER", "FARMER"]
        sellerProfile:
          $ref: '#/components/schemas/SellerProfileDto'
        accessibleFarms:
          type: array
          items:
            $ref: '#/components/schemas/AccessibleFarmSummaryDto'

    UpdateUserProfileRequest:
      type: object
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 255
          example: "Rustam B. Karimov"
        preferredLanguage:
          type: string
          enum: [uz-Latn, ru, uz-Cyrl]
          example: "uz-Latn"
        region:
          type: string
          example: "Toshkent viloyati"
        district:
          type: string
          example: "Yangiyoʻl tumani"
        avatarMediaId:
          type: string
          format: uuid
          nullable: true

    # -----------------------------------------------------------------------
    # Farm Core Schemas
    # -----------------------------------------------------------------------
    FarmDto:
      type: object
      required:
        - id
        - ownerUserId
        - name
        - region
        - district
        - legalType
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          example: "f1a2b3c4-1111-4000-a000-000000000001"
        ownerUserId:
          type: string
          format: uuid
          example: "e4b3c2a1-0000-4000-a000-000000000001"
        name:
          type: string
          example: "Oltin Voha Agro"
        region:
          type: string
          example: "Samarqand viloyati"
        district:
          type: string
          example: "Tayloq tumani"
        totalAreaHa:
          type: string
          pattern: '^[0-9]+(\.[0-9]{1,2})?$'
          example: "12.50"
        legalType:
          type: string
          enum: [DEHQON, FERMER, MCHJ, TOMORQA]
          example: "FERMER"
        createdAt:
          type: string
          format: date-time
          example: "2026-10-14T09:30:00Z"

    CreateFarmRequest:
      type: object
      required:
        - name
        - region
        - district
        - legalType
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 255
          example: "Oltin Voha Agro"
        region:
          type: string
          example: "Samarqand viloyati"
        district:
          type: string
          example: "Tayloq tumani"
        totalAreaHa:
          type: string
          pattern: '^[0-9]+(\.[0-9]{1,2})?$'
          example: "12.50"
        legalType:
          type: string
          enum: [DEHQON, FERMER, MCHJ, TOMORQA]
          example: "FERMER"

    UpdateFarmRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 255
          example: "Oltin Voha Bogʻdorchilik"
        totalAreaHa:
          type: string
          pattern: '^[0-9]+(\.[0-9]{1,2})?$'
          example: "15.00"
        legalType:
          type: string
          enum: [DEHQON, FERMER, MCHJ, TOMORQA]

    FarmMemberDto:
      type: object
      required:
        - id
        - farmId
        - userId
        - role
        - permissionsMask
        - status
      properties:
        id:
          type: string
          format: uuid
          example: "a1a2b3c4-5555-4000-a000-000000000001"
        farmId:
          type: string
          format: uuid
          example: "f1a2b3c4-1111-4000-a000-000000000001"
        userId:
          type: string
          format: uuid
          example: "b1a2b3c4-6666-4000-a000-000000000001"
        fullName:
          type: string
          example: "Jamshid Aliyev"
        phoneNumber:
          type: string
          example: "+998939876543"
        role:
          type: string
          enum: [OWNER, MANAGER, AGRONOMIST, WORKER]
          example: "AGRONOMIST"
        permissionsMask:
          type: string
          example: "READ,WRITE_ACTIVITY,RECORD_HARVEST"
        status:
          type: string
          enum: [INVITED, ACTIVE, REVOKED]
          example: "ACTIVE"

    AddFarmMemberRequest:
      type: object
      required:
        - phoneNumber
        - role
        - permissionsMask
      properties:
        phoneNumber:
          type: string
          pattern: '^(\+998)[0-9]{9}$'
          example: "+998939876543"
        role:
          type: string
          enum: [OWNER, MANAGER, AGRONOMIST, WORKER]
          example: "AGRONOMIST"
        permissionsMask:
          type: string
          example: "READ,WRITE_ACTIVITY,RECORD_HARVEST"

    FieldDto:
      type: object
      required:
        - id
        - farmId
        - name
        - area
        - areaUnit
      properties:
        id:
          type: string
          format: uuid
          example: "c1d2e3f4-2222-4000-a000-000000000001"
        farmId:
          type: string
          format: uuid
          example: "f1a2b3c4-1111-4000-a000-000000000001"
        name:
          type: string
          example: "1-Dala Issiqxona"
        area:
          type: string
          pattern: '^[0-9]+(\.[0-9]{1,2})?$'
          example: "1.20"
        areaUnit:
          type: string
          enum: [HECTARE, SOTKA, SQM]
          example: "HECTARE"
        boundaryGeojson:
          type: object
          nullable: true
