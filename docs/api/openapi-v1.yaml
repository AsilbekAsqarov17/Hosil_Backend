          $ref: '#/components/responses/NotFoundError'

  /market/seller/offers:
    post:
      summary: Create commercial seller offer
      operationId: createSellerOffer
      description: Publishes a commercial supply offer for an established catalog product. Restricted to verified commercial suppliers or cooperatives (DEC-004). Unit code must match category allowed units (DEC-009).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSellerOfferRequest'
      responses:
        '201':
          description: Seller offer created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerOfferDetailDto'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
    get:
      summary: List my seller offers
      operationId: listMySellerOffers
      description: Retrieves all offers created by the authenticated commercial supplier.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OfferStatusQueryParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          description: Paginated collection of seller offers owned by the caller.
          content:
            application/json:
              schema:
