openapi: 3.0.3
info:
  title: Hosil Platform REST API
  description: |
    Authoritative REST API specification for the Hosil agricultural ecosystem (Hosil Bozor, Hosil Farm, Hosil Logistika).
    Enforces shared identity, decoupled modular monolith domains, offline-first farm synchronization, and strict data privacy boundaries.
  version: 1.0.0
  contact:
    name: Hosil Core Platform Engineering
    url: https://hosil.uz
    email: dev@hosil.uz
  license:
    name: Proprietary

servers:
  - url: https://api.hosil.uz/api/v1
    description: Production Environment
  - url: http://localhost:8080/api/v1
    description: Local Docker / Development Environment

security:
  - BearerAuth: []

paths:
  # =========================================================================
  # AUTHENTICATION & IDENTITY MODULE (hosil-identity)
  # =========================================================================

  /auth/otp/request:
    post:
      summary: Request SMS OTP challenge
      operationId: requestOtpChallenge
      security: []
      description: |
        Generates and dispatches a 6-digit OTP code to an Uzbekistan phone number via SMS.
        Implements rate limiting (max 3 attempts per 5 minutes) and anti-enumeration generic responses.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
      responses:
        '200':
          description: OTP challenge successfully generated and dispatched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallengeResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '428':
          $ref: '#/components/responses/PreconditionRequiredError'
        '429':
          $ref: '#/components/responses/RateLimitError'

  /auth/telegram/link-session:
    post:
      summary: Create Telegram linking session (Dev / Milestone 6C.5)
      operationId: createTelegramLinkSession
      security: []
      description: |
        Generates a 10-minute linking session and deep link for the Telegram authentication bot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramLinkSessionRequest'
      responses:
        '200':
          description: Linking session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramLinkSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'

  /auth/telegram/status:
    post:
      summary: Check Telegram linking status (Dev / Milestone 6C.5)
      description: Validates linking status for an active session token without exposing phone numbers or account enumeration.
      operationId: checkTelegramLinkStatus
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramLinkStatusRequest'
      responses:
        '200':
          description: Telegram linking status checked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramLinkStatusResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'

  /auth/otp/verify:
    post:
      summary: Verify SMS OTP and authenticate
      operationId: verifyOtpAndAuthenticate
      security: []
      description: |
        Validates the one-time passcode against the active challenge.
        Upon success, consumes the challenge, records an active session, and returns an access/refresh token pair.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: Successfully authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          description: Challenge locked due to excessive failed attempts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /auth/token/refresh:
    post:
      summary: Refresh access token
      operationId: refreshAccessToken
      security: []
      description: |
        Exchanges a valid refresh token for a newly issued access token and rotated refresh token.
        Revokes the previous refresh token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
      responses:
        '200':
          description: Token pair refreshed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/logout:
    post:
      summary: Explicit user session logout
      operationId: logoutSession
      description: Revokes the active session associated with the submitted token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Session successfully revoked.
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /users/me:
    get:
      summary: Get current authenticated user profile
      operationId: getCurrentUserProfile
      description: Returns profile details, assigned roles, commercial seller verification status, and accessible farms.
      responses:
        '200':
          description: User profile details retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetailDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    patch:
      summary: Update current user profile
      operationId: updateCurrentUserProfile
      description: Modifies non-identity profile preferences (name, language, region, district).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileRequest'
      responses:
        '200':
          description: User profile successfully updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetailDto'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # =========================================================================
  # FARM MANAGEMENT MODULE (hosil-farm)
  # =========================================================================

  /farms:
    get:
      summary: List accessible farms
      operationId: listAccessibleFarms
      description: Returns a paginated list of farms where the authenticated user holds an active membership.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Paginated farm list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFarmResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      summary: Create new farm holding
      operationId: createFarm
      description: Registers a new farm. The caller automatically becomes the legal owner.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFarmRequest'
      responses:
        '201':
          description: Farm holding successfully created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmDto'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /farms/{farmId}:
    get:
      summary: Get farm holding details
      operationId: getFarmById
      parameters:
        - $ref: '#/components/parameters/FarmIdParam'
      responses:
        '200':
          description: Farm holding details retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      summary: Update farm holding profile
      operationId: updateFarmProfile
      parameters:
        - $ref: '#/components/parameters/FarmIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFarmRequest'
      responses:
        '200':
          description: Farm profile updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmDto'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /farms/{farmId}/members:
    get:
      summary: List farm members
      operationId: listFarmMembers
      parameters:
        - $ref: '#/components/parameters/FarmIdParam'
      responses:
        '200':
          description: Active farm members list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FarmMemberDto'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      summary: Add or invite member to farm
      operationId: addFarmMember
      parameters:
        - $ref: '#/components/parameters/FarmIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddFarmMemberRequest'
      responses:
        '201':
          description: Farm membership created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmMemberDto'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /farms/{farmId}/members/{membershipId}:
    delete:
      summary: Revoke farm membership
      operationId: revokeFarmMembership
      parameters:
        - $ref: '#/components/parameters/FarmIdParam'
        - $ref: '#/components/parameters/MembershipIdParam'
      responses:
        '204':
          description: Farm membership successfully revoked.
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /farms/{farmId}/fields:
    get:
      summary: List farm fields
      operationId: listFarmFields
      parameters:
        - $ref: '#/components/parameters/FarmIdParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Paginated field plots list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFieldResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      summary: Create field plot
      operationId: createField
      parameters:
        - $ref: '#/components/parameters/FarmIdParam'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFieldRequest'
      responses:
        '201':
          description: Field plot created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldDto'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /farms/{farmId}/fields/{fieldId}:
    get:
      summary: Get field details
      operationId: getFieldById
      parameters:
        - $ref: '#/components/parameters/FarmIdParam'
        - $ref: '#/components/parameters/FieldIdParam'
      responses:
        '200':
          description: Field plot details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      summary: Update field plot
      operationId: updateField
      parameters:
        - $ref: '#/components/parameters/FarmIdParam'
        - $ref: '#/components/parameters/FieldIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFieldRequest'
      responses:
        '200':
          description: Field plot updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldDto'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /farms/{farmId}/crop-cycles:
    get:
      summary: List crop cycles
      operationId: listCropCycles
      parameters:
        - $ref: '#/components/parameters/FarmIdParam'
        - name: fieldId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PLANNED, ACTIVE, HARVESTED, TERMINATED]
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Paginated crop cycles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCropCycleResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      summary: Create crop cycle
      operationId: createCropCycle
      parameters:
        - $ref: '#/components/parameters/FarmIdParam'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCropCycleRequest'
      responses:
        '201':
          description: Crop cycle initialized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CropCycleDto'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /farms/{farmId}/crop-cycles/{cycleId}:
    get:
      summary: Get crop cycle details
      operationId: getCropCycleById
      parameters:
        - $ref: '#/components/parameters/FarmIdParam'
        - $ref: '#/components/parameters/CycleIdParam'
      responses:
        '200':
          description: Crop cycle details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CropCycleDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      summary: Update crop cycle status or harvest dates
      operationId: updateCropCycle
      parameters:
        - $ref: '#/components/parameters/FarmIdParam'
        - $ref: '#/components/parameters/CycleIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCropCycleRequest'
      responses:
        '200':
          description: Crop cycle updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CropCycleDto'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /farms/{farmId}/activities:
    get:
      summary: List farm activities
      operationId: listFarmActivities
      parameters:
        - $ref: '#/components/parameters/FarmIdParam'
        - name: cropCycleId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: fieldId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          description: Paginated activity logs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivityResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      summary: Record daily agronomic activity
      operationId: recordFarmActivity
      parameters:
        - $ref: '#/components/parameters/FarmIdParam'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFarmActivityRequest'
      responses:
        '201':
          description: Activity recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmActivityDto'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /farms/{farmId}/activities/batch-sync:
    post:
      summary: Batch synchronize queued offline activities
      operationId: batchSyncActivities
      description: |
        Processes up to 50 queued offline activity mutations in a single request.
        Provides idempotent replay detection and optimistic conflict detection.
      parameters:
        - $ref: '#/components/parameters/FarmIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityBatchSyncRequest'
      responses:
        '200':
          description: Batch synchronization outcomes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityBatchSyncResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /farms/{farmId}/harvest-batches:
    get:
      summary: List farm harvest batches
      operationId: listFarmHarvestBatches
      parameters:
        - $ref: '#/components/parameters/FarmIdParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Harvest batches list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedHarvestBatchResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      summary: Record physical harvest batch
      operationId: recordHarvestBatch
      description: |
        Records bulk harvest yield from a crop cycle.
        Initializes unallocatedQuantity = recordedQuantity. Does NOT publish to marketplace.
      parameters:
        - $ref: '#/components/parameters/FarmIdParam'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHarvestBatchRequest'
      responses:
        '201':
          description: Harvest batch recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarvestBatchDto'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /harvest-batches/{batchId}:
    get:
      summary: Get harvest batch details
      operationId: getHarvestBatchById
      parameters:
        - $ref: '#/components/parameters/BatchIdParam'
      responses:
        '200':
          description: Harvest batch details and allocation summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarvestBatchDto'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # =========================================================================
  # MARKETPLACE PUBLICATION BOUNDARY (hosil-marketplace)
  # =========================================================================

  /market/harvest-listings:
    get:
      summary: Search and browse published harvest listings
      operationId: searchHarvestListings
      description: |
        Publicly accessible discovery endpoint for wholesale harvest listings on Hosil Bozor.
        Returns only listings with status PUBLISHED, sorted deterministically with id tie-breaker.
      security: []
      parameters:
        - $ref: '#/components/parameters/CropTypeQueryParam'
        - $ref: '#/components/parameters/RegionQueryParam'
        - $ref: '#/components/parameters/DistrictQueryParam'
        - $ref: '#/components/parameters/QualityGradeQueryParam'
        - $ref: '#/components/parameters/MinPriceQueryParam'
        - $ref: '#/components/parameters/MaxPriceQueryParam'
        - $ref: '#/components/parameters/IsRfqEnabledQueryParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          description: Paginated published harvest listings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedHarvestListingResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
    post:
      summary: Publish harvest listing to Hosil Bozor
      operationId: publishHarvestListing
      description: |
        Explicit operational bridge linking private farm harvest to public marketplace.
        Allocates stock from harvest_batch under pessimistic row-locking (SELECT ... FOR UPDATE).
        Returns a DTO exposing strictly public commercial fields.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishHarvestListingRequest'
      responses:
        '201':
          description: Harvest listing published and stock allocated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarvestListingDto'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          description: Stock conflict (insufficient unallocated batch quantity).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /market/harvest-listings/{listingId}:
    get:
      summary: Get published harvest listing detail
      operationId: getHarvestListingById
      description: |
        Publicly accessible detail endpoint. Returns commercial attributes for a single published listing.
        Returns 404 if the listing does not exist or has a non-published status (DRAFT, PAUSED, ARCHIVED, SUSPENDED).
      security: []
      parameters:
        - $ref: '#/components/parameters/ListingIdParam'
      responses:
        '200':
          description: Published harvest listing details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarvestListingDto'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /market/harvest-listings/{listingId}/inquiries:
    post:
      summary: Submit buyer RFQ inquiry on harvest listing
      operationId: submitRfqInquiry
      description: |
        Initiates a pre-order Request-for-Quote (RFQ) negotiation for an active harvest listing.
        Creates the inquiry and the initial proposal (Offer #1).
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ListingIdParam'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInquiryRequest'
      responses:
        '201':
          description: RFQ inquiry created and initial offer proposed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryDetailDto'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /market/inquiries:
    get:
      summary: List user RFQ inquiries
      operationId: listMyInquiries
      description: |
        Retrieves paginated RFQ inquiries where the authenticated user is either buyer or seller.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InquiryRoleQueryParam'
        - $ref: '#/components/parameters/InquiryStatusQueryParam'
        - $ref: '#/components/parameters/ListingIdQueryParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          description: Paginated inquiry summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInquirySummaryResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /market/inquiries/{inquiryId}:
    get:
      summary: Get inquiry details and full offer history
      operationId: getInquiryById
      description: |
        Retrieves complete negotiation details and chronological offer progression for an inquiry.
        Only the participating buyer and seller are authorized to view details.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InquiryIdParam'
      responses:
        '200':
          description: Inquiry details and historical offer progression.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryDetailDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /market/inquiries/{inquiryId}/offers:
    post:
      summary: Submit counteroffer on inquiry
      operationId: submitCounterOffer
      description: |
        Submits a counteroffer in response to the current active proposal.
        Supersedes the previous proposal and transfers the response turn to the counterparty.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InquiryIdParam'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitOfferRequest'
      responses:
        '201':
          description: Counteroffer submitted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryDetailDto'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /market/inquiries/{inquiryId}/accept:
    post:
      summary: Accept current active offer
      operationId: acceptOffer
      description: |
        Accepts the current proposal, binding the agreed commercial terms.
        Transitions the inquiry to AGREED and the current offer to ACCEPTED.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InquiryIdParam'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '200':
          description: Offer accepted and agreed terms bound.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryDetailDto'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /market/inquiries/{inquiryId}/reject:
    post:
      summary: Reject inquiry
      operationId: rejectInquiry
      description: |
        Formally terminates the negotiation by rejecting the inquiry.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InquiryIdParam'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectInquiryRequest'
      responses:
        '200':
          description: Inquiry rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryDetailDto'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /market/inquiries/{inquiryId}/withdraw:
    post:
      summary: Withdraw inquiry (Buyer only)
      operationId: withdrawInquiry
      description: |
        Allows the buyer who initiated the inquiry to withdraw it before agreement.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InquiryIdParam'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawInquiryRequest'
      responses:
        '200':
          description: Inquiry withdrawn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryDetailDto'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /market/orders/from-rfq:
    post:
      summary: Place wholesale order from agreed RFQ
      operationId: createOrderFromRfq
      description: |
        Transforms an agreed RFQ inquiry into a formal wholesale purchase order in status AWAITING_SELLER_CONFIRMATION.
        Atomically locks inventory and creates an inventory reservation. Enforces strict quantity conservation.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWholesaleOrderRequest'
      responses:
        '201':
          description: Order created and inventory reserved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailDto'
        '200':
          description: Idempotent hit; returns existing order without duplicate reservation.
          headers:
            X-Cache-Lookup:
              schema:
                type: string
                example: "IDEMPOTENT_HIT"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailDto'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /market/orders:
    get:
      summary: List authenticated user's orders
      operationId: listMyOrders
      description: Lists orders where caller is buyer or seller, with role and status filtering and deterministic pagination.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderRoleQueryParam'
        - $ref: '#/components/parameters/OrderStatusQueryParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          description: Paginated order summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrderSummaryResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /market/orders/{orderId}:
    get:
      summary: Get order details
      operationId: getOrderDetail
      description: Retrieves complete order details including items, active reservation, and status history.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderIdParam'
      responses:
        '200':
          description: Order details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /market/orders/{orderId}/confirm:
    post:
      summary: Confirm order (Seller confirmation)
      operationId: confirmOrder
      description: Seller explicitly confirms the wholesale order, binding the fulfillment commitment.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderIdParam'
      responses:
        '200':
          description: Order confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /market/orders/{orderId}/reject:
    post:
      summary: Reject order (Seller rejection)
      operationId: rejectOrder
      description: Seller rejects the order before confirmation. Transitions order to CANCELLED and atomically releases inventory reservation.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderIdParam'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderDecisionRequest'
      responses:
        '200':
          description: Order rejected and reservation released.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /market/orders/{orderId}/cancel:
    post:
      summary: Cancel order
      operationId: cancelOrder
      description: Participant cancels the order under permitted lifecycle stages (DEC-010). Releases inventory reservation.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderIdParam'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderDecisionRequest'
      responses:
        '200':
          description: Order cancelled and reservation released.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /market/orders/{orderId}/history:
    get:
      summary: Get order status history
      operationId: getOrderStatusHistory
      description: Retrieves complete append-only audit trail of state transitions for this order.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderIdParam'
      responses:
        '200':
          description: Chronological state transition audit trail.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderStatusHistoryDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # =========================================================================
  # AGRICULTURAL-INPUT CATALOG & SELLER OFFERS (hosil-marketplace)
  # =========================================================================

  /market/catalog/categories:
    get:
      summary: List agricultural input categories
      operationId: listCatalogCategories
      description: Returns active agricultural input product categories along with their permitted measurement units.
      security: []
      responses:
        '200':
          description: List of active categories and allowed unit codes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryDto'

  /market/catalog/products:
    get:
      summary: Browse and search master catalog products
      operationId: searchCatalogProducts
      description: Discovers master agricultural input products filtered by category or search keyword, including price floor and active offer count.
      security: []
      parameters:
        - $ref: '#/components/parameters/CatalogCategoryIdQueryParam'
        - $ref: '#/components/parameters/CatalogSearchQueryParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
      responses:
