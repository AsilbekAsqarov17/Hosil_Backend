      responses:
        '200':
          description: Detailed seller offer record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerOfferDetailDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      summary: Update seller offer
      operationId: updateSellerOffer
      description: Modifies pricing, available inventory, minimum order quantity, or fulfillment options of an active seller offer.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OfferIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSellerOfferRequest'
      responses:
        '200':
          description: Updated seller offer record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerOfferDetailDto'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /market/seller/offers/{offerId}/deactivate:
    post:
      summary: Deactivate seller offer
      operationId: deactivateSellerOffer
      description: Immediately deactivates a seller offer, removing it from public discovery.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OfferIdParam'
      responses:
        '200':
          description: Deactivated seller offer record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerOfferDetailDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /market/input-orders:
    post:
      summary: Direct agricultural-input checkout
      operationId: createInputOrder
      description: Places an agricultural-input order from one or more seller offers belonging to the same verified seller, creating temporary reservations and computing server-side pricing (DEC-005).
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInputOrderRequest'
      responses:
        '201':
          description: Order placed successfully with status PENDING_PAYMENT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailDto'
        '200':
          description: Idempotent replay hit.
          headers:
            X-Cache-Lookup:
              schema:
                type: string
                example: IDEMPOTENT_HIT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailDto'
