                $ref: '#/components/schemas/PaginatedCatalogProductResponse'
    post:
      summary: Create master catalog product (Platform Administration)
      operationId: createCatalogProduct
      description: Registers a new master agricultural input product item in the platform catalog. Restricted to administrators.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCatalogProductRequest'
      responses:
        '201':
          description: Master catalog product created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogProductDetailDto'
        '400':
