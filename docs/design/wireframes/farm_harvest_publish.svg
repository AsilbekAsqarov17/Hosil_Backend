<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812" style="background:#F8F9FA; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Status Bar -->
  <rect width="375" height="44" fill="#FFFFFF"/>
  <text x="24" y="28" font-size="14" font-weight="600" fill="#1A1C1E">09:41</text>
  <rect x="320" y="19" width="16" height="10" rx="2" fill="none" stroke="#1A1C1E" stroke-width="1.5"/>
  <rect x="322" y="21" width="10" height="6" rx="1" fill="#1A1C1E"/>

  <!-- Top App Bar -->
  <rect y="44" width="375" height="48" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="20" y="74" font-size="18" fill="#1E293B">←</text>
  <text x="50" y="74" font-size="16" font-weight="700" fill="#1E293B">Hosilni Bozorga Chiqarish</text>

  <!-- Physical Batch Summary Card -->
  <rect x="16" y="104" width="343" height="82" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <g transform="translate(30, 122)">
    <text x="0" y="14" font-size="13" font-weight="700" fill="#1E293B">Pomidor (Pink Paradise F1) • 1-Nav</text>
    <text x="0" y="32" font-size="11" fill="#64748B">Yigʻilgan: 2-iyul 2026 • 1-Dala Issiqxona</text>
    <text x="0" y="52" font-size="12" font-weight="700" fill="#2E7D32">Jami Hosil: 5,000 kg <tspan font-weight="400" fill="#64748B">(Erkin qoldiq: 5,000 kg)</tspan></text>
  </g>

  <!-- Public vs Private Privacy Guarantee Box -->
  <rect x="16" y="196" width="343" height="74" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <g transform="translate(28, 212)">
    <text x="0" y="12" font-size="11" font-weight="700" fill="#1D4ED8">👁️ Ommaviy va Maxfiy Maʼlumotlar Chegarasi:</text>
    <text x="0" y="28" font-size="10" fill="#1E40AF">✅ Ochiq: Ekin turi, navi, miqdori, narxi, tuman nomi, rasmlar.</text>
    <text x="0" y="44" font-size="10" fill="#1E40AF">🔒 Maxfiy: Dala joylashuvi, aniq koordinatalar, dori/oʻgʻit tarixi.</text>
  </g>

  <!-- Form: Allocated Quantity for Marketplace -->
  <g transform="translate(16, 284)">
    <text x="0" y="14" font-size="12" font-weight="700" fill="#1E293B">Bozorga chiqariladigan miqdor (kg) *</text>
    <rect y="22" width="343" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="14" y="50" font-size="14" font-weight="700" fill="#1E293B">2000.000</text>
    <text x="315" y="50" font-size="12" font-weight="600" fill="#64748B" text-anchor="end">KG</text>
    <text x="0" y="80" font-size="10" fill="#64748B">Qolgan 3,000 kg omborda saqlanadi yoki keyinroq sotiladi.</text>
  </g>

  <!-- Form: Pricing Strategy (Fixed vs RFQ) -->
  <g transform="translate(16, 380)">
    <text x="0" y="14" font-size="12" font-weight="700" fill="#1E293B">Narx siyosati (Pricing) *</text>
    
    <g transform="translate(0, 22)">
      <!-- Price per Unit -->
      <rect width="210" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="14" y="28" font-size="14" font-weight="700" fill="#2E7D32">6,500</text>
      <text x="195" y="28" font-size="11" fill="#64748B" text-anchor="end">soʻm/kg</text>
      
      <!-- RFQ Toggle -->
      <g transform="translate(220, 0)">
        <rect width="123" height="44" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
        <text x="61" y="27" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Kelishuv (RFQ)</text>
      </g>
    </g>
  </g>

  <!-- Form: Wholesale Minimum Order Quantity & Increment Step -->
  <g transform="translate(16, 464)">
    <g transform="translate(0, 0)">
      <text x="0" y="14" font-size="12" font-weight="700" fill="#1E293B">Min buyurtma (MOQ) *</text>
      <rect y="22" width="164" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="14" y="50" font-size="14" font-weight="700" fill="#1E293B">100 kg</text>
    </g>
    
    <g transform="translate(179, 0)">
      <text x="0" y="14" font-size="12" font-weight="700" fill="#1E293B">Qadam miqdori (Step) *</text>
      <rect y="22" width="164" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="14" y="50" font-size="14" font-weight="700" fill="#1E293B">10 kg</text>
    </g>
  </g>

  <!-- Public Region Display -->
  <g transform="translate(16, 548)">
    <text x="0" y="14" font-size="12" font-weight="700" fill="#1E293B">Ommaviy joylashuv:</text>
    <rect y="22" width="343" height="40" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
    <text x="14" y="46" font-size="12" font-weight="600" fill="#334155">📍 Samarqand viloyati, Tayloq tumani (Fermadan olingan)</text>
  </g>

  <!-- Product Photos Section -->
  <g transform="translate(16, 622)">
    <text x="0" y="14" font-size="12" font-weight="700" fill="#1E293B">Hosil rasmlari (1-5 ta rasm yuklang) *</text>
    <g transform="translate(0, 22)">
      <rect width="60" height="50" rx="8" fill="#E2E8F0"/>
      <text x="30" y="30" font-size="10" fill="#475569" text-anchor="middle">Rasm 1</text>
      
      <rect x="70" width="60" height="50" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="3 3"/>
      <text x="100" y="32" font-size="18" fill="#64748B" text-anchor="middle">+</text>
    </g>
  </g>

  <!-- Primary Publish Button -->
  <g transform="translate(16, 730)">
    <rect width="343" height="48" rx="10" fill="#2E7D32"/>
    <text x="171" y="30" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Hosil Bozorida Eʼlon Qilish</text>
  </g>
</svg>
