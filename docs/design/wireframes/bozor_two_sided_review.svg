    <text x="0" y="32" font-size="11" fill="#64748B">Aloqa tezligi, vaqtida yetkazish, kelishuvga rioya qilish</text>
    
    <!-- Stars -->
    <g transform="translate(0, 48)">
      <text x="0" y="24" font-size="28" fill="#EAB308">★</text>
      <text x="36" y="24" font-size="28" fill="#EAB308">★</text>
      <text x="72" y="24" font-size="28" fill="#EAB308">★</text>
      <text x="108" y="24" font-size="28" fill="#EAB308">★</text>
      <text x="144" y="24" font-size="28" fill="#CBD5E1">★</text>
      <text x="185" y="20" font-size="14" font-weight="700" fill="#1E293B">4.0 <tspan font-size="11" font-weight="400" fill="#64748B">(Yaxshi)</tspan></text>
    </g>
  </g>

  <!-- Vector 2: Product / Crop Quality (1-5 Stars) -->
  <rect x="16" y="350" width="343" height="116" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <g transform="translate(28, 368)">
    <text x="0" y="14" font-size="13" font-weight="700" fill="#1E293B">2. Mahsulot Sifati (Pomidor 1-Nav):</text>
    <text x="0" y="32" font-size="11" fill="#64748B">Tavsifga mosligi, tozaligi, buzilmaganligi</text>
    
    <!-- Stars -->
    <g transform="translate(0, 48)">
      <text x="0" y="24" font-size="28" fill="#EAB308">★</text>
      <text x="36" y="24" font-size="28" fill="#EAB308">★</text>
      <text x="72" y="24" font-size="28" fill="#EAB308">★</text>
      <text x="108" y="24" font-size="28" fill="#EAB308">★</text>
      <text x="144" y="24" font-size="28" fill="#EAB308">★</text>
      <text x="185" y="20" font-size="14" font-weight="700" fill="#1E293B">5.0 <tspan font-size="11" font-weight="400" fill="#64748B">(Aʼlo)</tspan></text>
    </g>
  </g>

  <!-- Photo Upload Section (Max 3) -->
  <rect x="16" y="476" width="343" height="96" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <g transform="translate(28, 492)">
    <text x="0" y="12" font-size="12" font-weight="700" fill="#1E293B">Mahsulot rasmini yuklang (Maks. 3 ta):</text>
    
    <g transform="translate(0, 24)">
