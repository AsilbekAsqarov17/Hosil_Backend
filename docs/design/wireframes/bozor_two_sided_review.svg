  <text x="28" y="198" font-size="10" fill="#5B21B6">Bahoingiz ikkala tomon ham yozmaguncha yoki 14 kun oʻtmaguncha oshkor qilinmaydi.</text>

  <!-- Vector 1: Seller Professional Conduct (1-5 Stars) -->
  <rect x="16" y="224" width="343" height="116" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <g transform="translate(28, 242)">
