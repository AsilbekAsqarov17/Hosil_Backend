        <rect width="50" height="50" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      </g>
    </g>
  </g>

  <!-- Commentary Input -->
  <rect x="16" y="582" width="343" height="90" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="28" y="604" font-size="12" fill="#94A3B8">Fikringizni batafsil yozing (1000 belgigacha)...</text>
  <text x="345" y="662" font-size="10" fill="#94A3B8" text-anchor="end">0 / 1000</text>

  <!-- Equal Weight Notice -->
  <text x="187" y="692" font-size="10" fill="#64748B" text-anchor="middle">⚖️ Teng vazn qoidasi: 1 bitim = 1 ovoz (Summa taʼsir qilmaydi)</text>

  <!-- Submit Action Button -->
  <rect x="16" y="714" width="343" height="48" rx="10" fill="#2E7D32"/>
  <text x="187" y="744" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Bahoni Yuborish (Submit Review)</text>
