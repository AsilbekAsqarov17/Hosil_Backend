  <text x="50" y="74" font-size="16" font-weight="700" fill="#1E293B">Bitimga Baho Berish (DEC-018)</text>

  <!-- Qualifying Order Banner -->
  <rect x="16" y="104" width="343" height="48" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="28" y="124" font-size="12" font-weight="700" fill="#1E293B">Buyurtma: ORD-20261014-9X2A</text>
  <text x="28" y="142" font-size="10" fill="#64748B">Sotuvchi: Rustam Karimov • 2,000 kg Pomidor</text>
  <rect x="280" y="116" width="68" height="22" rx="4" fill="#EBF7ED"/>
  <text x="314" y="131" font-size="9" font-weight="700" fill="#2E7D32" text-anchor="middle">YAKUNLANDI</text>

