  <!-- Terms and Quoting Disclaimer -->
  <rect x="16" y="620" width="343" height="52" rx="8" fill="#F1F5F9"/>
  <text x="28" y="640" font-size="10" font-weight="700" fill="#475569">💡 Qanday ishlaydi?</text>
  <text x="28" y="656" font-size="10" fill="#64748B">Soʻrov eʼlon qilingach, tasdiqlangan haydovchilar oʻz narxlarini taklif qilishadi.</text>

  <!-- Submit Action -->
  <g transform="translate(16, 714)">
