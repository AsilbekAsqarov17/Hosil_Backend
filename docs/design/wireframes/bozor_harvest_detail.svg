<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812" style="background:#FFFFFF; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Status Bar -->
  <rect width="375" height="44" fill="#FFFFFF"/>
  <text x="24" y="28" font-size="14" font-weight="600" fill="#1A1C1E">09:41</text>
  <rect x="320" y="19" width="16" height="10" rx="2" fill="none" stroke="#1A1C1E" stroke-width="1.5"/>
  <rect x="322" y="21" width="10" height="6" rx="1" fill="#1A1C1E"/>

  <!-- Top App Bar -->
  <rect y="44" width="375" height="48" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="20" y="74" font-size="18" fill="#1E293B">←</text>
  <text x="50" y="74" font-size="15" font-weight="700" fill="#1E293B">Ulgurji Hosil Tafsiloti</text>
  <text x="340" y="74" font-size="16" fill="#1E293B">↗</text>

  <!-- Product Image Carousel Area -->
  <rect y="92" width="375" height="200" fill="#F1F5F9"/>
  <text x="187" y="190" font-size="14" fill="#94A3B8" text-anchor="middle">[Hosil Rasmlari Galereyasi (1/4)]</text>
  <!-- Pagination indicator -->
  <circle cx="170" cy="275" r="3" fill="#2E7D32"/>
  <circle cx="180" cy="275" r="3" fill="#CBD5E1"/>
  <circle cx="190" cy="275" r="3" fill="#CBD5E1"/>
  <circle cx="200" cy="275" r="3" fill="#CBD5E1"/>

  <!-- Title & Grade -->
  <g transform="translate(16, 308)">
    <rect width="64" height="20" rx="4" fill="#2E7D32"/>
    <text x="32" y="14" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">1-NAV</text>
    <rect x="72" y="0" width="80" height="20" rx="4" fill="#EBF7ED"/>
    <text x="112" y="14" font-size="10" font-weight="600" fill="#2E7D32" text-anchor="middle">Pink Paradise</text>
    
    <text x="0" y="46" font-size="20" font-weight="800" fill="#1E293B">Pomidor (Issiqxona hosili)</text>
    <text x="0" y="66" font-size="12" fill="#64748B">Joylashuv: Tayloq tumani, Samarqand viloyati</text>
    
    <!-- Price Block -->
    <text x="0" y="98" font-size="22" font-weight="800" fill="#2E7D32">6,500 soʻm <tspan font-size="13" font-weight="500" fill="#64748B">/ kg</tspan></text>
  </g>

  <!-- Quantity & Allocation Metrics Card -->
  <rect x="16" y="425" width="343" height="74" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <g transform="translate(32, 445)">
    <text x="0" y="12" font-size="11" fill="#64748B">Jami Mavjud:</text>
    <text x="0" y="32" font-size="15" font-weight="700" fill="#1E293B">2,000 kg (2.0 t)</text>
    
    <line x1="110" y1="0" x2="110" y2="38" stroke="#E2E8F0" stroke-width="1"/>
    
    <text x="125" y="12" font-size="11" fill="#64748B">Min Buyurtma (MOQ):</text>
    <text x="125" y="32" font-size="15" font-weight="700" fill="#1E293B">100 kg</text>
    
    <line x1="230" y1="0" x2="230" y2="38" stroke="#E2E8F0" stroke-width="1"/>
    
    <text x="245" y="12" font-size="11" fill="#64748B">Qadam:</text>
    <text x="245" y="32" font-size="15" font-weight="700" fill="#1E293B">+10 kg</text>
  </g>

  <!-- Seller Profile Card -->
  <rect x="16" y="512" width="343" height="88" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <circle cx="48" cy="556" r="20" fill="#E2E8F0"/>
  <text x="48" y="562" font-size="14" font-weight="700" fill="#475569" text-anchor="middle">R</text>
  
  <text x="80" y="546" font-size="14" font-weight="700" fill="#1E293B">Rustam Karimov (Fermer xoʻjaligi)</text>
  <rect x="80" y="552" width="60" height="16" rx="4" fill="#EBF7ED"/>
  <text x="110" y="564" font-size="9" font-weight="700" fill="#2E7D32" text-anchor="middle">✓ Tasdiqlangan</text>
  
  <text x="80" y="586" font-size="11" fill="#475569">⭐ <tspan font-weight="700" fill="#1E293B">4.8</tspan> (34 baho) • 142 muvaffaqiyatli bitim</text>

  <!-- Privacy Disclosure Notice -->
  <rect x="16" y="612" width="343" height="52" rx="8" fill="#F1F5F9"/>
  <text x="28" y="632" font-size="10" font-weight="700" fill="#475569">🔒 Maxfiylik Kafolati (Data Privacy):</text>
  <text x="28" y="648" font-size="10" fill="#64748B">Fermerning aniq koordinatalari va faoliyat daftari begonalarga koʻrinmaydi.</text>

  <!-- Quantity Selector & Action Footer -->
  <rect y="682" width="375" height="130" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  
  <g transform="translate(16, 696)">
    <text x="0" y="16" font-size="12" font-weight="600" fill="#475569">Miqdor tanlang (kg):</text>
    <!-- Stepper -->
    <rect x="225" y="0" width="118" height="32" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="240" y="21" font-size="16" font-weight="700" fill="#1E293B" text-anchor="middle">−</text>
    <text x="284" y="21" font-size="13" font-weight="700" fill="#1E293B" text-anchor="middle">200 kg</text>
    <text x="328" y="21" font-size="16" font-weight="700" fill="#1E293B" text-anchor="middle">+</text>
  </g>

  <!-- Dual Action Buttons -->
  <g transform="translate(16, 742)">
    <!-- Secondary: RFQ / Message -->
    <rect width="140" height="46" rx="10" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.5"/>
    <text x="70" y="28" font-size="12" font-weight="700" fill="#2E7D32" text-anchor="middle">Taklif Yuborish (RFQ)</text>
    
    <!-- Primary: Direct Purchase Request -->
    <rect x="150" width="193" height="46" rx="10" fill="#2E7D32"/>
    <text x="246" y="28" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Xarid Soʻrovi (1.3 mln)</text>
  </g>
</svg>
