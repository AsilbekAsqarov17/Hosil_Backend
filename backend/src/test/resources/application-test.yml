spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;INIT=CREATE DOMAIN IF NOT EXISTS INET AS VARCHAR(50)
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  thymeleaf:
    cache: false

hosil:
  security:
    jwt:
      secret: test_jwt_secret_must_be_at_least_256_bits_long_for_hmac_sha256_test_only
      expiration-seconds: 900
    otp:
      secret: test_otp_secret_must_be_at_least_256_bits_long_for_hmac_sha256_test_only
  sms:
    provider: NOOP
  marketplace:
    order:
      confirmation-expiry-hours: 24
      payment-expiry-hours: 24
  payment:
    sandbox:
      enabled: true
      simulation-enabled: true
      secret-key: test_sandbox_secret_hosil_2026_test_only
    monitoring:
      stale-threshold-minutes: 30
  inventory:
    expiry:
      enabled: false
      polling-interval-ms: 60000
      batch-size: 50
  farm:
    ai:
      enabled: true
      storage-dir: target/test-uploads/crop-health
      max-image-size-bytes: 10485760
      min-dimension: 200
      max-dimension: 4096
      model-name: Hosil-CropVision-Sandbox
      model-version: 1.0.0-test
  logistics:
    leasing:
      interest-rate-annual: 0.18
      sandbox:
        enabled: true
        partner-code: MOCK_AGROBANK_SANDBOX
        partner-name: Agrobank Mock Sandbox
  reputation:
    blind-expiration:
      enabled: false
